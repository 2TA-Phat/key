<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIST 鍵管理システム｜ログイン</title>
<style>
    body { 
        font-family: sans-serif; 
        /* Thiết lập hình nền phủ kín toàn màn hình */
        background-image: url("{{ url_for('static', filename='images/Background_login_images.jpg') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        margin: 0; 
    }
    .card { 
        background: rgba(255, 255, 255, 0.9); 
        padding: 30px; 
        border-radius: 12px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
        width: 320px; 
    }
    h3 { 
        text-align: center; 
        margin-top: 0; 
        margin-bottom: 20px; 
        color: #333; 
    }
    label { 
        font-size: 14px; 
        font-weight: bold; 
        color: #555; 
    }
    input { 
        width: 100%; 
        padding: 10px; 
        margin-top: 6px; 
        margin-bottom: 15px; 
        border: 1px solid #ccc; 
        border-radius: 6px; 
        box-sizing: border-box; 
        font-size: 15px; 
    }
    button { 
        width: 100%; 
        padding: 12px; 
        background: #007bff; 
        color: white; 
        border: none; 
        border-radius: 6px; 
        font-size: 16px; 
        font-weight: bold; 
        cursor: pointer; 
    }
    .guest-link { display:block; margin-top:12px; padding:12px; text-align:center; border-radius:6px; background:#eef6ff; color:#086ac1; font-weight:600; text-decoration:none; }
    .guest-link:hover { background:#dbeeff; }
    .error { 
        color: #d9534f; 
        font-size: 14px; 
        margin-bottom: 15px; 
        text-align: center; 
    }
</style>
<script src="{{ url_for('static', filename='js/tab_session.js') }}"></script></head>
<body>
<div class="card">
    <h3>TIST 鍵管理システム</h3>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form action="/login" method="post">
        <label>ユーザー名</label>
        <input type="text" name="username" required>
        <label>パスワード</label>
        <input type="password" name="password" required>
        <button type="submit">ログイン</button>
    </form>
    <a href="{{ url_for('guest_student_submit') }}" class="guest-link">
    ログインせずに開錠申請
    </a>
    <p style="text-align:center;margin:20px 0 0"><a href="/register">生徒新規登録</a></p>
</div>
</body>
</html>
