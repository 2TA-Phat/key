<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>開錠権限設定</title><style>body{font-family:sans-serif;background:#f5f6f8;padding:25px}main{max-width:1000px;margin:auto}section{background:white;padding:20px;margin:16px 0;border-radius:10px}label{display:inline-block;margin:8px 15px 8px 0}input{padding:9px;border:1px solid #bbb;border-radius:6px}button{padding:10px 24px;background:#067ee8;color:white;border:0;border-radius:6px}small{color:#666}</style></head><body><main><h1>Discord・開錠権限設定</h1><p><a href="/admin">申請一覧へ戻る</a></p><p>Discordの「開発者モード」を有効にし、ユーザーIDをコピーして登録してください。BotからのDMを受信できる状態にしてください。</p>{% for u in accounts %}<section><h3>{{ u.name }}（{{ u.username }} / {{ u.role }}）</h3><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="manager_id" value="{{ u.id }}"><label>DiscordユーザーID <input name="discord_id" value="{{ u.discord_id or '' }}" placeholder="123456789012345678"></label><label>学籍番号 <input name="student_id" value="{{ u.student_id or '' }}"></label><p>開錠可能な教室</p>{% for room in rooms %}<label><input type="checkbox" name="rooms" value="{{ room }}" {% if room in granted.get(u.id, []) %}checked{% endif %}> {{ room }}</label>{% endfor %}<p><button>保存する</button></p></form></section>{% endfor %}</main></body></html>
