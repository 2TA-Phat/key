<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生徒登録承認</title><style>body{font-family:sans-serif;background:#f5f5f5;padding:18px}.card{background:white;padding:18px;border-radius:12px;overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}button{background:#218838;border:0;color:white;padding:9px 12px;border-radius:6px;cursor:pointer}.reject{background:#b63030}.error{color:#c21}form{display:inline-block;margin:2px}</style><script src="{{ url_for('static', filename='js/tab_session.js') }}"></script></head><body><h2>生徒登録承認（管理者専用）</h2><p><a href="/admin">管理画面へ戻る</a></p><div class="card">{% if error %}<p class="error">{{ error }}</p>{% endif %}{% if pending %}<table><thead><tr><th>学籍番号</th><th>名前</th><th>ユーザー名</th><th>学科</th><th>クラス</th><th>電話番号</th><th>メールアドレス</th><th>操作</th></tr></thead><tbody>{% for u in pending %}<tr><td>{{ u.student_id }}</td><td>{{ u.name }}</td><td>{{ u.username }}</td><td>{{ u.department }}</td><td>{{ u.school_class }}</td><td>{{ u.phone }}</td><td>{{ u.email }}</td><td><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="manager_id" value="{{ u.id }}"><button name="action" value="approve" onclick="return confirm('この生徒を承認しますか？')">承認</button><button class="reject" name="action" value="reject" onclick="return confirm('この申請を却下しますか？')">却下</button></form></td></tr>{% endfor %}</tbody></table>{% else %}<p>承認待ちの申請はありません。</p>{% endif %}</div></body></html>
