<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>開錠申請｜TIST</title><style>body{font-family:sans-serif;background:#f5f6f8;margin:0;padding:28px}.card{max-width:560px;margin:20px auto;background:white;border-radius:12px;padding:24px;box-shadow:0 2px 10px #0001}label{display:block;margin:16px 0 6px;font-weight:600}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd3df;border-radius:7px;font-size:16px}button{background:#0783e8;color:white;border:0;margin-top:20px;font-weight:600}.msg{color:#157a39}.err{color:#c21}a{color:#086ac1}</style></head><body><main class="card"><h2>開錠申請</h2><p>{% if authenticated %}ログイン済み{% else %}ログインが必要です{% endif %}　<a href="/login">ログイン</a>　{% if authenticated %}<a href="/logout">ログアウト</a>{% endif %}</p>{% if error %}<p class="err">{{ error }}</p>{% endif %}{% if sent %}<p class="msg">{{ message }}</p>{% endif %}<form method="post">{% if authenticated %}<input type="hidden" name="csrf" value="{{ session.get('csrf', '') }}">{% endif %}<label>学籍番号</label><input name="student_id" value="{{ student_id or '' }}" {% if authenticated and session.get('role') not in ['Administrator','Admin','管理者','教員','Teacher','Operator'] %}readonly{% endif %} required><label>教室</label><select name="key" required>{% for room in rooms %}<option value="{{ room }}">{{ room }}</option>{% endfor %}</select><label>操作</label><select name="action" required>{% for action in actions %}<option value="{{ action }}">{{ action }}</option>{% endfor %}</select><button>申請する</button></form><p>登録済みのアカウントでログインしてください。ログイン済みでも利用権限がない教室では承認が必要です。</p><a href="/register">生徒新規登録</a></main></body></html>
