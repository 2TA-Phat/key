<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIST事務所 環境管理画面</title>

<!-- Liên kết đúng file CSS bạn đã tạo -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-header">TIST事務所_管理画面</div>
    <ul class="sidebar-menu">
        <li class="menu-category" onclick="toggleSubmenu('applicant-menu', 'applicant-arrow')">
            応募者管理 <span id="applicant-arrow">∨</span>
        </li>
        <ul id="applicant-menu" class="submenu-list">
            <li>
                <a href="/users" class="menu-item">
                    <span class="circle-icon"></span> ユーザー
                </a>
            </li>
        </ul>

        <li class="menu-category" onclick="toggleSubmenu('key-menu', 'key-arrow')">
            鍵管理 <span id="key-arrow">∨</span>
        </li>
        <ul id="key-menu" class="submenu-list">
            <li>
                <a href="/admin" class="menu-item active">
                    <span class="circle-icon"></span> 申請一覧
                </a>
            </li>
        </ul>

        <li class="menu-category" onclick="toggleSubmenu('system-menu', 'system-arrow')">
            システム管理 <span id="system-arrow">∨</span>
        </li>
        <ul id="system-menu" class="submenu-list">
            <li>
                <a href="/admin/managers" class="menu-item">
                    <span class="circle-icon"></span> 管理者
                </a>
            </li>
        </ul>
    </ul>
</div>

<!-- MAIN CONTENT WRAPPER -->
<div class="main-wrapper">
    <div class="navbar">
        <div class="navbar-left">
            <span class="menu-toggle">☰</span>
            <span class="badge-green">TIST事務所 環境管理画面</span>
        </div>
        <div class="navbar-right">
            <span class="badge-admin">Administrator</span>
            <span>管理者</span>
            <a href="/logout" class="logout-btn">ログアウト</a>
        </div>
    </div>

    <div class="content">
        <h2 class="page-title">ダッシュボード (鍵管理)</h2>

        <!-- UNPROCESSED SECTION -->
        <div id="pending-section">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #444;">未処理（Pending）</h3>
            <div id="pending-top" class="pagination"></div>
            <div id="pending-list"></div>
            <div id="pending-bottom" class="pagination"></div>
        </div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #dee2e6;">

        <!-- PROCESSED SECTION -->
        <div id="done-section">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #444;">操作済み（Done）</h3>
            <div id="done-top" class="pagination"></div>
            <div id="done-list"></div>
            <div id="done-bottom" class="pagination"></div>
        </div>
    </div>
</div>

<!-- 1. Lấy dữ liệu từ Flask gán vào biến JS -->
<script>
    const pending = {{ pending | tojson }};
    const done = {{ done | tojson }};
</script>

<!-- 2. Nhúng đúng file JS bạn đã tạo -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

<!-- 3. Gọi các hàm vẽ giao diện -->
<script>
    renderPending();
    renderDone();
</script>

</body>
</html>
