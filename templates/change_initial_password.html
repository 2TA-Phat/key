<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>初期パスワード変更｜TIST</title><script src="{{ url_for('static', filename='js/tab_session.js') }}"></script><style>body{background:#f3f6fa;font:15px sans-serif;margin:0;padding:35px 12px}.card{max-width:440px;margin:30px auto;background:#fff;padding:26px;border-radius:12px;box-shadow:0 3px 18px #0001}label{display:block;margin:17px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3dd;border-radius:6px}button{width:100%;padding:12px;background:#1478ba;border:none;border-radius:6px;color:white;font-weight:bold;margin-top:24px;cursor:pointer}.error{color:#c22}.notice{background:#fff5df;padding:12px;border-radius:6px}a{display:block;margin-top:16px;text-align:center}</style></head><body><div class="card"><h2>初期パスワードの変更</h2><p class="notice">安全のため、初回ログイン時にパスワードを変更してください。変更するまで鍵管理機能は利用できません。</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>現在のパスワード</label><input type="password" name="current_password" required autocomplete="current-password"><label>新しいパスワード（8～16文字）</label><input type="password" name="new_password" minlength="8" maxlength="16" required autocomplete="new-password"><label>新しいパスワード（確認）</label><input type="password" name="confirm_password" minlength="8" maxlength="16" required autocomplete="new-password"><button type="submit">パスワードを変更</button></form><a href="{{ url_for('logout') }}">ログアウト</a></div></body></html>
