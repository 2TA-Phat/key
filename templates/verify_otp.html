<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discord認証</title><style>body{font-family:sans-serif;background:#f4f6f8;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;border-radius:12px;padding:32px;width:min(90%,360px);box-shadow:0 4px 20px #0001}input,button{width:100%;box-sizing:border-box;padding:13px;margin:10px 0;border-radius:8px;border:1px solid #ccc;font-size:18px}button{background:#0679dd;color:white;border:0}.err{color:#c21}</style></head><body><div class="card"><h2>認証コード入力</h2><p>Discordのダイレクトメッセージに届いた6桁の認証コードを入力してください。</p>{% if error %}<p class="err">{{ error }}</p>{% endif %}<form method="post"><input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="6桁の認証コード"><button>認証する</button></form><a href="/logout">ログイン画面へ戻る</a></div></body></html>
